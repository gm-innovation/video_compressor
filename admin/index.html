<!doctype html>
<html lang="pt-BR"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Admin do projeto e do sistema — LECSOR</title>
<link rel="stylesheet" href="/fronts/vms.css">
<link rel="stylesheet" href="/fronts/admin.css">
</head><body>

<section id="entrada" class="entrada">
  <h1>LECSOR · administração</h1>
  <p class="sub">Área da operação: acompanhamento do projeto e administração do sistema.</p>
  <div id="entrada-erro" class="erro oculto"></div>
  <form id="form-entrar">
    <label for="email">E-mail</label>
    <input id="email" type="email" autocomplete="username" required>
    <label for="senha">Senha</label>
    <input id="senha" type="password" autocomplete="current-password" required>
    <button class="principal" type="submit">Entrar</button>
  </form>
</section>

<div class="sistema oculto" id="sistema">
  <aside class="lateral">
    <div class="marca"><span class="simbolo">L</span><span class="nome">LECSOR · ADMIN</span></div>

    <div class="grupo">Projeto</div>
    <button class="item on" data-tela="painel"><span class="ic">📈</span>Painel</button>
    <button class="item" data-tela="fases"><span class="ic">🧭</span>Fases</button>
    <button class="item" data-tela="medicoes"><span class="ic">📐</span>Medições</button>
    <button class="item" data-tela="decisoes"><span class="ic">📌</span>Decisões</button>
    <button class="item" data-tela="evidencias"><span class="ic">🗂</span>Evidências</button>
    <button class="item" data-tela="documentos"><span class="ic">📄</span>Documentos</button>

    <div class="grupo">Sistema</div>
    <button class="item" data-tela="clientes"><span class="ic">🏢</span>Clientes</button>
    <button class="item" data-tela="embarcacoes"><span class="ic">🚢</span>Embarcações</button>
    <button class="item" data-tela="cameras"><span class="ic">🎥</span>Câmeras</button>
    <button class="item" data-tela="envios"><span class="ic">📥</span>Enviar vídeo</button>
    <button class="item" data-tela="usuarios"><span class="ic">👥</span>Usuários</button>
    <button class="item" data-tela="analises"><span class="ic">🧠</span>Análises</button>
    <button class="item" data-tela="marcas"><span class="ic">✏️</span>Marcas e zonas</button>
    <button class="item" data-tela="auditoria"><span class="ic">🛡</span>Auditoria</button>
    <button class="item" data-tela="saude"><span class="ic">⚙</span>Saúde do sistema</button>

    <div class="chip-conta">
      <span class="bolinha" id="iniciais">··</span>
      <span style="min-width:0">
        <span class="email" id="conta-email"></span>
        <span id="conta-papel" style="display:block;font-size:11px"></span>
      </span>
    </div>
  </aside>

  <main class="principal">
    <header class="cabecalho">
      <div>
        <h1 id="titulo-tela">Painel do projeto</h1>
        <div class="sub" id="sub-tela">Acompanhamento do projeto e estado do sistema, tudo lido do banco.</div>
      </div>
      <div class="controles">
        <a class="pil" href="/app" target="_blank" rel="noopener" style="text-decoration:none">tela do cliente</a>
        <span class="pil" id="relogio-servidor">—</span>
        <button class="pil" id="btn-atualizar">Atualizar</button>
        <button class="pil" id="btn-sair">sair</button>
      </div>
    </header>
    <div class="area-tela" id="tela"></div>
  </main>
</div>

<script src="/admin/admin.js"></script>
</body></html>
