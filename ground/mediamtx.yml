# Config do lado terra (bancada): mediamtx recebendo SRT e publicando WebRTC (baixa latencia).
logLevel: info
logDestinations: [stdout]

rtsp: yes
rtspAddress: 127.0.0.1:8554
# So' TCP: o produto nunca le' RTSP por UDP e o modo UDP abre :8000/:8001 (RTP/RTCP). Se essas portas
# estiverem ocupadas na maquina do cliente, o mediamtx RECUSA subir — plug & play nao pode depender de
# portas que o produto nao usa.
rtspTransports: [tcp]
# listeners HTTP auxiliares do mediamtx (metricas, pprof, playback): por padrao sobem em :9998/:9999/
# :9996 em TODAS as interfaces; aqui ficam presos no loopback, como o resto.
metricsAddress: 127.0.0.1:9998
pprofAddress: 127.0.0.1:9999
playbackAddress: 127.0.0.1:9996
rtmp: no
hls: yes
hlsAddress: 127.0.0.1:8888
hlsVariant: lowLatency
hlsSegmentCount: 7
hlsSegmentDuration: 1s
hlsPartDuration: 200ms

webrtc: yes
webrtcAddress: 127.0.0.1:8889
webrtcEncryption: no
webrtcAllowOrigins: ["*"]
# WebRTC precisa do UDP alcancavel pelo navegador do cliente (o WHEP HTTP fica local):
webrtcLocalUDPAddress: :8189

srt: yes
srtAddress: 127.0.0.1:8890

api: yes
apiAddress: 127.0.0.1:9997

paths:
  # O RELE' DO GRAVADOR (dono, 27/11/2026): a camera do radar e' segurada pelo GRAVADOR (24h) e o vivo
  # le' daqui em vez de abrir o mesmo dispositivo. O prefixo `gravador-` fica de FORA do repasse: o
  # gravador publica 24h por dia e repassar isto para terra seria banda dobrada sem ninguem pedindo.
  "~^gravador-": {}
  all_others:
    # PC de captura: todo fluxo publicado aqui (camera ligada direto na maquina, ja' comprimido)
    # e' repassado para o lado terra quando LECSOR_DESTINO_SRT estiver definido (ex.: 187.127.60.250:8890).
    # Sem essa variavel nada sobe — e' o que impede a VPS, que roda o mesmo mediamtx, de subir para si.
    runOnAvailable: python ground/repasse.py $MTX_PATH
    runOnAvailableRestart: yes
