# Config do lado terra (bancada): mediamtx recebendo SRT e publicando WebRTC (baixa latencia).
logLevel: info
logDestinations: [stdout]

rtsp: yes
rtspAddress: 127.0.0.1:8554
rtmp: no
hls: yes
hlsAddress: 127.0.0.1:8888
hlsVariant: lowLatency
hlsSegmentCount: 7
hlsSegmentDuration: 1s
hlsPartDuration: 200ms

webrtc: yes
webrtcAddress: 127.0.0.1:8889
webrtcEncryption: no
webrtcAllowOrigins: ["*"]
# WebRTC precisa do UDP alcancavel pelo navegador do cliente (o WHEP HTTP fica local):
webrtcLocalUDPAddress: :8189

srt: yes
srtAddress: 127.0.0.1:8890

api: yes
apiAddress: 127.0.0.1:9997

paths:
  all_others:
    # PC de captura: todo fluxo publicado aqui (camera ligada direto na maquina, ja' comprimido)
    # e' repassado para o lado terra quando LECSOR_DESTINO_SRT estiver definido (ex.: 187.127.60.250:8890).
    # Sem essa variavel nada sobe — e' o que impede a VPS, que roda o mesmo mediamtx, de subir para si.
    runOnAvailable: python ground/repasse.py $MTX_PATH
    runOnAvailableRestart: yes
